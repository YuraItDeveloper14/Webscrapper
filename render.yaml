databases:
  - name: leadgen-db
    plan: free
    databaseName: leadgen
    user: leadgen

services:
  - type: web
    name: leadgen
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python serve.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: leadgen-db
          property: connectionString
