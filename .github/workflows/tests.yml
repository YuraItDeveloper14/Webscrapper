name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Nothing here reaches the network; the panel test runs on a throwaway
      # local SQLite file.
      - name: Install test dependencies
        run: pip install pytest httpx==0.27.2 selectolax==0.3.21 flask==3.0.3 SQLAlchemy==2.0.35

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Every module compiles
        run: python -m compileall -q leadgen webapp run.py serve.py backfill_coords.py
