name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The modules under test never reach the network or a database;
      # they only import httpx and selectolax.
      - name: Install test dependencies
        run: pip install pytest httpx==0.27.2 selectolax==0.3.21

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Every module compiles
        run: python -m compileall -q leadgen webapp run.py serve.py backfill_coords.py
