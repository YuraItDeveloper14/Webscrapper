name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Модулі під тестом не ходять у мережу й базу; verify.py лише імпортує httpx.
      - name: Install test dependencies
        run: pip install pytest httpx==0.27.2

      - name: Unit tests
        run: python -m pytest -q tests
